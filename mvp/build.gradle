plugins {
    id 'com.android.library'
    id 'maven-publish'//用来推送aar到jitpack
}
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.18647499996'//插件id，格式：com.github.18647499996
                artifactId = 'base'//插件名称
                version = VERSION_CODE.toString()//版本号
                //引用使用格式：implementation 'com.github.18647499996:base:1.0'
            }
        }
    }
}
android {
    compileSdkVersion 33
    buildToolsVersion "30.0.3"

    defaultConfig {
        minSdkVersion 17
        targetSdkVersion 33
        versionCode VERSION_CODE.toInteger()
        versionName VERSION_NAME.toString()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            storeFile file("../liu.keystore")
            storePassword "123456"
            keyAlias "key"
            keyPassword "123456"
        }
    }

    buildTypes {
        release {
            zipAlignEnabled true
            signingConfig signingConfigs.release  //使用上述签名信息
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "isProduction", "false"
        }
        debug {
            minifyEnabled false
            //debug时使用release签名
            signingConfig signingConfigs.release
            //Zip代码压缩优化
            zipAlignEnabled true
            buildConfigField "boolean", "isProduction", "false"
        }
        predebug.initWith(debug)
        predebug {
            signingConfig signingConfigs.release
            buildConfigField "boolean", "isProduction", "true"
        }
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // RxJava3 Android
    api 'io.reactivex.rxjava3:rxandroid:3.0.2'
    // RxAndroid
    api 'io.reactivex:rxandroid:1.2.1'
    // retrofit2
    api 'com.squareup.retrofit2:retrofit:2.9.0'
    // retrofit 数据类型转换工厂
    api 'com.squareup.retrofit2:converter-scalars:2.9.0'
    // retrofit 数据模型转换工厂
    api 'com.squareup.retrofit2:adapter-rxjava:2.9.0'
    // retrofit json 转换工厂
    api 'com.squareup.retrofit2:converter-gson:2.9.0'
    // 沉浸式状态栏
    api 'com.geyifeng.immersionbar:immersionbar:3.2.2'

}